<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="list">
        <ul>
            <li>RIVAS, WILGEN </li>
            <li>NALING, RANREY </li>
            <li>BULATAO, MARVIN SON </li>
            <li>FERNANDEZ, JAIME </li>
            <li>YANOC, FRED ANTHONY</li>
        </ul>
    </div>


    <div class="calculator">
        <div class="display">
            <input type="text" class="display-input" placeholder="0" readonly>
        </div>
        <div class="buttons">
            <button onclick="clearView()" class="btn clear">C</button>
            <button onclick="insert('±')" class="btn operator">±</button>
            <button onclick="insert('%')" class="btn operator">%</button>
            <button onclick="insert('÷')" class="btn operator">÷</button>
            
            <button onclick="insert('7')" class="btn">7</button>
            <button onclick="insert('8')" class="btn">8</button>
            <button onclick="insert('9')" class="btn">9</button>
            <button onclick="insert('*')" class="btn operator">×</button>
            
            <button onclick="insert('4')" class="btn">4</button>
            <button onclick="insert('5')" class="btn">5</button>
            <button onclick="insert('6')" class="btn">6</button>
            <button onclick="insert('-')" class="btn operator">-</button>
            
            <button onclick="insert('1')" class="btn">1</button>
            <button onclick="insert('2')" class="btn">2</button>
            <button onclick="insert('3')" class="btn">3</button>
            <button onclick="insert('+')" class="btn operator">+</button>
            
            <button onclick="insert('0')" class="btn zero">0</button>
            <button onclick="insert('.')" class="btn">.</button>
            <button onclick="insert('=')" class="btn equals">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
