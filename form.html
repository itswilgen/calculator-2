<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>

    <style>
        body {
            background-color: rgb(133, 148, 148);
        }
        form {
            
            display: flex;
            margin: 50px;
            padding: 20px;
            left: 50px;
            justify-content: center;
        }
        input {
            margin: 10px;
            padding: 5px;
        }
        button {
            margin: 10px;
            padding: 5px 10px;
        }
    </style>

</head>
<body>
    <h1>Form Submission</h1>
    <form class="form">
        <input onclick="" type="name" placeholder="Enter your first name"> <br>
        <input onclick="" type="name" placeholder="Enter your last name"> <br>
        <button onclick="myFunction()">Submit</button>
    </form>
    
</body>
    <script>
        const firstNameInput = document.querySelector('input[type="name"]:first-of-type');
    const lastNameInput = document.querySelector('input[type="name"]:last-of-type');

    firstNameInput.onclick = function () {
        firstNameInput.style.backgroundColor = 'lightblue';
    };

    lastNameInput.onclick = function () {
        lastNameInput.style.backgroundColor = 'lightgreen';
    };

    function myFunction() {
        if (firstNameInput.value === '' || lastNameInput.value === '') {
            alert("Please fill in both fields before submitting.");
            return;
        }
        alert("successfully submitted");
    }
    

    </script>
</html>
